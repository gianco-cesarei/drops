<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Onda come sottrazione: mostra sempre lo sfondo, non un colore sovrapposto. -->
    <mask id="wave-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <g fill="#000000">
        <rect x="290" y="482" width="28" height="60" rx="14"/>
        <rect x="342" y="452" width="28" height="120" rx="14"/>
        <rect x="394" y="412" width="28" height="200" rx="14"/>
        <rect x="446" y="372" width="28" height="280" rx="14"/>
        <rect x="498" y="312" width="28" height="400" rx="14"/>
        <rect x="550" y="372" width="28" height="280" rx="14"/>
        <rect x="602" y="412" width="28" height="200" rx="14"/>
        <rect x="654" y="452" width="28" height="120" rx="14"/>
        <rect x="706" y="482" width="28" height="60" rx="14"/>
      </g>
    </mask>
  </defs>

  <rect x="16" y="16" width="992" height="992" rx="230" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="8"/>

  <!-- Stesso marchio Drops, invertito su fondo chiaro per distinguere la Beta. -->
  <g transform="translate(512 512) scale(0.88) translate(-512 -512)">
    <path
      fill="#22C55E"
      mask="url(#wave-cutout)"
      d="M512 126
         C444 228 254 449 254 640
         C254 783 370 899 512 899
         C654 899 770 783 770 640
         C770 449 580 228 512 126Z"/>

  </g>
</svg>
